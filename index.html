<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdul Hadi | Developer Profile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
    }

    h1 {
      font-size: 1.5rem;
      color: #f0f6fc;
    }

    .tagline {
      font-size: 0.9rem;
      color: #8b949e;
      margin-top: 5px;
    }

    .skills-section {
      margin: 25px 0;
    }

    .skills-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .tag {
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .counter-section {
      margin-bottom: 20px;
    }

    #likeBtn {
      background: transparent;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #likeBtn:hover {
      background: #21262d;
      border-color: #8b949e;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      text-decoration: none;
      background: #238636;
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #2ea043;
    }

    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }

    .btn-secondary:hover {
      background: #30363d;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="profile-header">
      <div class="avatar">AH</div>
      <h1>Abdul Hadi</h1>
      <p class="tagline">Computer Engineering Student & Developer</p>
    </div>

    <div class="skills-section">
      <h3>Tech & Skills</h3>
      <div class="tags">
        <span class="tag">C++</span>
        <span class="tag">Python</span>
        <span class="tag">ROS2 & Robotics</span>
        <span class="tag">n8n & Docker</span>
        <span class="tag">OpenCV & YOLO</span>
      </div>
    </div>

    <div class="counter-section">
      <button id="likeBtn">⚡ Send High-Five <span id="likeCount">0</span></button>
    </div>

    <div class="links">
      <a href="https://github.com/hadi-ce04" target="_blank" rel="noopener noreferrer" class="btn">GitHub Profile</a>
      <a href="mailto:your-email@example.com" class="btn btn-secondary">Contact Me</a>
    </div>
  </div>

  <script>
    let count = 0;
    const likeBtn = document.getElementById('likeBtn');
    const likeCount = document.getElementById('likeCount');

    likeBtn.addEventListener('click', () => {
      count++;
      likeCount.textContent = count;
    });
  </script>

</body>
</html>
